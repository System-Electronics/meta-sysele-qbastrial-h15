name: QBAstrial H15 Yocto Build

run-name: QBAstrial H15 Build • ${{ github.ref_name }} • ${{ github.event_name }}

# Builds the QBAstrial H15 image on top of meta-sysele-astrial-h15 at a pinned commit.
# A tag vX.Y.Z publishes a release; a manual run keeps the artifacts of the run.
# No pull_request trigger: the build uses the signing keys, which a fork must not reach.
#
# Runs on the organization's self-hosted runner (one machine, shared with meta-sysele-astrial-h15
# and future products): free, persistent cache, and the CVE database kept fresh by the VPS timer,
# instead of a paid GitHub-hosted runner building and fetching everything from scratch each time.
on:
  workflow_dispatch:
    inputs:
      sbom:
        description: "none, standard (SPDX and cve-check) or full (also the checksums). Empty: the repository variable SYSELE_SBOM, or standard."
        type: string
        default: ''
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'
  schedule:
    # Primo del mese, poco dopo l'aggiornamento notturno del database CVE (03:30 UTC) e dopo
    # bump-poky di meta-sysele-astrial-h15 (03:00 UTC): canarino, non pubblica nulla di
    # permanente (github.ref_type non e' 'tag' su uno schedulato).
    - cron: '0 4 1 * *'

env:
  # SBOM level, see meta-sysele-bsp/kas/astrial-h15-machine.yml: none, standard (SPDX and cve-check)
  # or full. QBAstrial e' il prodotto consegnato (meta-sysele-astrial-h15 non lo e'): la SBOM e'
  # importante qui, quindi il default e' "standard", non "none".
  SYSELE_SBOM: ${{ inputs.sbom || vars.SYSELE_SBOM || 'standard' }}
  # meta-sysele-astrial-h15, tag v1.2.2.
  BASE_LAYER_REPO: System-Electronics/meta-sysele-astrial-h15
  BASE_LAYER_REF: 6d15fef02e0e5547f48db8dd0b255d4b74238ba8
  HAILO_SOC_TAG: 1.12.0
  # sha256 of `openssl rsa -noout -modulus` of the customer key pair (modulus 9E71...).
  KEY_MODULUS_SHA256: baa96baf0ea08e7d31c3986972b9ea240132d265a882219ae5015b25f80f9155

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      # First step: a missing or wrong key stops the run before the build.
      - name: Check the secure boot key
        env:
          HAILO_CUSTOMER_KEYPAIR: ${{ secrets.HAILO_CUSTOMER_KEYPAIR }}
        run: |
          set -euo pipefail
          if [ -z "$HAILO_CUSTOMER_KEYPAIR" ]; then
            echo "::error::Secret HAILO_CUSTOMER_KEYPAIR is missing."
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/qba-assets"
          printf '%s\n' "$HAILO_CUSTOMER_KEYPAIR" > "$RUNNER_TEMP/qba-assets/customer_keypair.pem"
          if ! openssl rsa -in "$RUNNER_TEMP/qba-assets/customer_keypair.pem" -check -noout >/dev/null 2>&1; then
            echo "::error::HAILO_CUSTOMER_KEYPAIR is not a valid RSA private key."
            exit 1
          fi
          got=$(openssl rsa -in "$RUNNER_TEMP/qba-assets/customer_keypair.pem" -noout -modulus 2>/dev/null | sha256sum | cut -d' ' -f1)
          if [ "$got" != "$KEY_MODULUS_SHA256" ]; then
            echo "::error::HAILO_CUSTOMER_KEYPAIR has an unexpected modulus (${got:0:16}, expected ${KEY_MODULUS_SHA256:0:16})."
            exit 1
          fi
          echo "Secure boot key verified (${got:0:16})."

      # The SWU signing key. Its public half goes into the images.
      - name: Check the SWU signing key
        env:
          SWU_SIGNING_KEY: ${{ secrets.SWU_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SWU_SIGNING_KEY" ]; then
            echo "::error::Secret SWU_SIGNING_KEY is missing."
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/qba-assets"
          printf '%s\n' "$SWU_SIGNING_KEY" > "$RUNNER_TEMP/qba-assets/swu_signing_key.pem"
          if ! openssl rsa -in "$RUNNER_TEMP/qba-assets/swu_signing_key.pem" -check -noout >/dev/null 2>&1; then
            echo "::error::SWU_SIGNING_KEY is not a valid RSA private key."
            exit 1
          fi
          openssl pkey -in "$RUNNER_TEMP/qba-assets/swu_signing_key.pem" -pubout -out "$RUNNER_TEMP/qba-assets/swupdate-public.pem"
          pub=$(openssl pkey -pubin -in "$RUNNER_TEMP/qba-assets/swupdate-public.pem" -outform DER | sha256sum | cut -c1-16)
          echo "SWU signing key verified. Public key fingerprint: $pub"
          echo "SWU_PUBKEY_FINGERPRINT=$pub" >> "$GITHUB_ENV"

      - name: Configure environment
        run: |
          echo "BB_ISOLATE_NETWORK=0" >> $GITHUB_ENV
          echo "BB_NO_NETWORK=0" >> $GITHUB_ENV

      - name: Install KAS
        run: |
          # Niente "sudo apt-get" qui: l'utente del runner non ha privilegi di root. I
          # pacchetti di sistema per la build (build-essential, gawk, texinfo, python3-venv,
          # ...) sono gia' installati una volta sola sulla macchina (condivisa con
          # meta-sysele-astrial-h15, stesso elenco). Qui creiamo solo il venv per kas.
          python3 -m venv "$RUNNER_TEMP/kas-venv"
          "$RUNNER_TEMP/kas-venv/bin/pip" install "kas==5.3"
          echo "$RUNNER_TEMP/kas-venv/bin" >> "$GITHUB_PATH"

      - name: Checkout this layer
        uses: actions/checkout@v4
        with:
          path: meta-sysele-qbastrial-h15

      - name: Checkout the base layer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BASE_LAYER_REPO }}
          ref: ${{ env.BASE_LAYER_REF }}
          path: meta-sysele-bsp

      - name: Persistent Yocto cache on the runner
        # ~/yocto-cache/qbastrial-h15 sta fuori da _work: sopravvive a una workspace ripulita
        # o a un runner riregistrato. E' lo stesso runner usato da meta-sysele-astrial-h15 e
        # da futuri prodotti, quindi sstate e downloads sono separati per prodotto; il
        # database CVE invece e' condiviso (non e' specifico di un prodotto), tenuto
        # aggiornato dal timer della VPS: da qui un link CVE_CHECK -> ../cve-db.
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          PERSIST="$HOME/yocto-cache/qbastrial-h15"
          mkdir -p "$PERSIST"
          ln -sfn ../cve-db "$PERSIST/CVE_CHECK"
          ls -ld "$PERSIST"

      - name: Setup Build Environment
        run: |
          git clone --branch "$HAILO_SOC_TAG" --single-branch \
            https://github.com/hailo-ai/meta-hailo-soc.git
          cd meta-hailo-soc
          git submodule update --init --recursive
          cp -r ../meta-sysele-bsp ./meta-sysele-bsp
          cp -r ../meta-sysele-qbastrial-h15 ./meta-sysele-qbastrial-h15
          ln -sfn "$HOME/yocto-cache/qbastrial-h15" yocto-cache

          cat > qbastrial-h15-ci.yml <<'KAS'
          header:
            version: 11
            includes:
              - kas/yocto-base.yml
              - meta-sysele-bsp/kas/astrial-h15-vpu-base.yml
              - kas/targets/hailo-soc-target-core-image-hailo-dev.yml
              - meta-sysele-bsp/kas/astrial-h15-machine.yml
              - meta-sysele-qbastrial-h15/kas/qbastrial-h15.yml

          build_system: openembedded
          KAS
          echo "===== qbastrial-h15-ci.yml ====="
          cat qbastrial-h15-ci.yml

      - name: Check the CVE database on the runner
        if: env.SYSELE_SBOM != 'none' && runner.environment == 'self-hosted'
        run: |
          # Il database lo tiene aggiornato il timer della VPS. Senza, la build prosegue ma
          # il referto CVE manca, e una release senza referto non deve passare inosservata.
          DB="$HOME/yocto-cache/cve-db/nvdcve_2-2.db"
          if [ ! -s "$DB" ]; then
            echo "::error::No CVE database at $DB: the VPS update timer has not produced one"
            exit 1
          fi
          AGE=$(( ( $(date +%s) - $(stat -c %Y "$DB") ) / 3600 ))
          echo "CVE database: $(du -h "$DB" | cut -f1), updated ${AGE} h ago"
          [ "$AGE" -le 48 ] || echo "::warning::CVE database is ${AGE} h old"

      - name: Create Patch for BitBake Network Isolation
        run: |
          cd meta-hailo-soc
          BB_WORKER=$(find . -name "bitbake-worker" -type f | head -n 1)
          if [ -n "$BB_WORKER" ]; then
            cp "$BB_WORKER" "$BB_WORKER.orig"
            sed -i 's/bb.utils.disable_network(uid, gid)/# Network isolation disabled for CI build/' "$BB_WORKER"
          else
            echo "Warning: Could not find BitBake worker script"
          fi
          BB_UTILS=$(find . -name "utils.py" -path "*/bitbake/lib/bb/*" -type f | head -n 1)
          if [ -n "$BB_UTILS" ]; then
            cp "$BB_UTILS" "$BB_UTILS.orig"
            sed -i 's/def disable_network(uid, gid):/def disable_network(uid, gid):\n    return  # Function disabled for CI build/' "$BB_UTILS"
          else
            echo "Warning: Could not find BitBake utils.py"
          fi

      - name: Build Yocto Image with KAS
        run: |
          cd meta-hailo-soc
          ulimit -n 65536 || echo "WARN: cannot raise the fd limit"

          export BB_ISOLATE_NETWORK=0
          export BB_NO_NETWORK=0

          export QBA_SECURE_ASSETS_DIR="$RUNNER_TEMP/qba-assets"
          export QBA_SWU_PRIVATE_KEY="$RUNNER_TEMP/qba-assets/swu_signing_key.pem"

          # BSP version shown on the board: the tag name, "unreleased" otherwise.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            export SYSELE_BSP_VERSION="${{ github.ref_name }}"
          fi

          export BITBAKE_UI_OPTS="-k"
          export BB_LOGCONFIG=""
          export BB_CONSOLELOG=""
          export BB_DEFAULT_TASK="build"
          export GITHUB_ACTIONS_BUILD=1
          export BB_ENV_PASSTHROUGH_ADDITIONS="QBA_SECURE_ASSETS_DIR QBA_SWU_PRIVATE_KEY SYSELE_BSP_VERSION SYSELE_SBOM GITHUB_SHA GITHUB_REPOSITORY GITHUB_RUN_ID BB_ISOLATE_NETWORK BB_NO_NETWORK BITBAKE_UI_OPTS BB_LOGCONFIG BB_CONSOLELOG BB_DEFAULT_TASK GITHUB_ACTIONS_BUILD"

          set -e
          if ! kas build qbastrial-h15-ci.yml -- -k; then
            echo "ERROR: KAS build failed"
            exit 1
          fi

      - name: Collect Failed Task Logs
        if: failure()
        run: |
          set +e
          BUILD=meta-hailo-soc/build
          mkdir -p failure-logs
          COOKER=$(ls -t "$BUILD"/tmp/log/cooker/*/console-latest.log 2>/dev/null | head -1)
          [ -n "$COOKER" ] && tail -n 200 "$COOKER" || echo "(no cooker log)"
          df -h; free -h
          find "$BUILD/tmp/log" -name '*.log' -exec \
            grep -h "Logfile of failure stored in:" {} + 2>/dev/null \
            | sed 's/.*stored in: //' | tr -d '\r' | sort -u > /tmp/failed.txt
          while read -r f; do
            [ -f "$f" ] || continue
            name=$(printf '%s' "$f" | sed 's|.*/tmp/work/||; s|/|_|g')
            cp "$f" "failure-logs/$name"
            tail -n 120 "$f"
          done < /tmp/failed.txt
          grep -rlE "PRIVATE KEY|BEGIN .*KEY" failure-logs/ 2>/dev/null | xargs -r rm -f

      - name: Remove the key and other sensitive files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/qba-assets"
          find meta-hailo-soc/ -name "customer_keypair.pem" -delete || true
          find meta-hailo-soc/ -name "*.pem" -delete || true
          find meta-hailo-soc/ -name "*private*key*" -delete || true
          find meta-hailo-soc/build -name "*.log" -exec grep -l "PRIVATE\|SECRET\|KEY" {} \; -delete || true

      - name: Validate Release Artifacts
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY="meta-hailo-soc/build/tmp/deploy/images/astrial-h15"
          required_artifacts=(
            "core-image-hailo-dev-astrial-h15.wic"
            "hailo-update-image-astrial-h15.swu"
            "fitImage-astrial-h15.bin"
            "u-boot-initial-env-astrial-h15"
            "hailo15_uart_recovery_fw.bin"
            "hailo15_scu_bl.bin"
            "scu_bl_cfg_a.bin"
            "hailo15_scu_fw.bin"
            "u-boot.dtb.signed"
            "u-boot-spl.bin"
            "u-boot-initial-env"
            "customer_certificate.bin"
            "u-boot-tfa.itb"
          )
          for artifact in "${required_artifacts[@]}"; do
            if [ ! -s "${DEPLOY}/${artifact}" ]; then
              echo "::error file=${DEPLOY}/${artifact}::Required release artifact is missing or empty"
              exit 1
            fi
            ls -lh "${DEPLOY}/${artifact}"
          done
          for script in hailo15_spi_flash_program program_spi_flash.sh tftp_server.py uart_boot_fw_loader; do
            if [ ! -s "meta-sysele-bsp/scripts/${script}" ]; then
              echo "::error::Required script ${script} is missing or empty"
              exit 1
            fi
          done

      - name: Build the SBOMs
        if: env.SYSELE_SBOM != 'none'
        run: bash meta-sysele-bsp/ci/build-sboms.sh

      - name: Archive Build Artifacts
        id: upload_build
        uses: actions/upload-artifact@v4
        with:
          name: qbastrial-h15-yocto-build
          path: |
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/core-image-hailo-dev-astrial-h15.wic
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/hailo-update-image-astrial-h15.swu
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/fitImage-astrial-h15.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot-initial-env-astrial-h15
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/hailo15_uart_recovery_fw.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/hailo15_scu_bl.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/scu_bl_cfg_a.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/hailo15_scu_fw.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot.dtb.signed
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot-spl.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot-initial-env
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/customer_certificate.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot-tfa.itb
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/*.spdx.json
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/*.spdx.index.json
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/*.spdx.tar.zst
            meta-hailo-soc/build/tmp/log/cve/cve-summary.json
            meta-hailo-soc/build/tmp/log/cve/cve-summary
            meta-sysele-bsp/scripts/
          if-no-files-found: error

      - name: Archive SBOMs
        id: upload_sbom
        if: env.SYSELE_SBOM != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: qbastrial-h15-sbom
          path: |
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/core-image-hailo-dev-astrial-h15-build.spdx.json
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/core-image-hailo-dev-astrial-h15-deployed.spdx.json
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/*.spdx.tar.zst
            meta-hailo-soc/build/tmp/log/cve/cve-summary.json
          if-no-files-found: error

      - name: Archive Build Logs
        id: upload_logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qbastrial-h15-build-logs
          path: |
            meta-hailo-soc/build/tmp/log/
            meta-hailo-soc/build/buildhistory/
            failure-logs/
          if-no-files-found: warn

      - name: Download Links
        if: always()
        env:
          BUILD_URL: ${{ steps.upload_build.outputs.artifact-url }}
          LOGS_URL: ${{ steps.upload_logs.outputs.artifact-url }}
          SBOM_URL: ${{ steps.upload_sbom.outputs.artifact-url }}
        run: |
          echo "Image and flashing files: ${BUILD_URL:-not produced, the build did not get that far}"
          echo "Build logs:               ${LOGS_URL:-not produced}"
          echo "SBOMs and CVE report:     ${SBOM_URL:-not produced, this build did not make one}"

      - name: Download Build Artifacts for Release
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@v4
        with:
          name: qbastrial-h15-yocto-build
          path: ./release-files

      - name: Create Compressed Release Archive
        if: github.ref_type == 'tag'
        run: |
          cd release-files
          # upload-artifact keeps the paths below the common root of the files, so the images arrive under
          # meta-hailo-soc/ and the scripts under meta-sysele-bsp/. The archive holds everything at its root,
          # which is where program_spi_flash.sh looks for the images.
          cp -p meta-sysele-bsp/scripts/* .
          cp -p meta-hailo-soc/build/tmp/deploy/images/astrial-h15/* .
          cp -rp meta-hailo-soc/build/tmp/log/cve/* . 2>/dev/null || true
          rm -rf meta-hailo-soc meta-sysele-bsp
          chmod +x *.sh *.py hailo15_spi_flash_program uart_boot_fw_loader
          for f in core-image-hailo-dev-astrial-h15.wic hailo-update-image-astrial-h15.swu \
                   u-boot-tfa.itb scu_bl_cfg_a.bin program_spi_flash.sh; do
            [ -e "$f" ] || { echo "ERROR: $f is not in the archive after flattening" >&2; exit 1; }
          done
          NAME="qbastrial-h15-yocto-build-${{ github.ref_name }}"
          echo "ARCHIVE_NAME=$NAME" >> "$GITHUB_ENV"
          tar -czf "../$NAME.tar.gz" .
          cd ..
          ls -lh "$NAME.tar.gz"

      - name: Publish the release for the pushed tag
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: QBAstrial H15 BSP ${{ github.ref_name }}
          body: |
            Layer `meta-sysele-qbastrial-h15` on `meta-sysele-astrial-h15` at `${{ env.BASE_LAYER_REF }}`.

            - Commit: ${{ github.sha }}
            - Yocto: kirkstone (poky `yocto-4.0.35`), Hailo Vision Processor package ${{ env.HAILO_SOC_TAG }}

            Extract `${{ env.ARCHIVE_NAME }}.tar.gz`. `program_spi_flash.sh` programs the SPI-NOR once, through the
            mask ROM on UART1; `core-image-hailo-dev-astrial-h15.wic` goes to the eMMC over TFTP from the U-Boot menu.

            The SWU is signed (RSA-PSS). The images accept only the key with public fingerprint
            `${{ env.SWU_PUBKEY_FINGERPRINT }}` (sha256 of the DER, first 16 hex digits).

            Flashing requires Hailo's `hailo15_board_tools`, not included.
          files: ${{ env.ARCHIVE_NAME }}.tar.gz
          prerelease: ${{ contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
