name: QBAstrial H15 - continuous build

run-name: QBAstrial H15 Build • ${{ github.ref_name }} • ${{ github.event_name }}

on:
  push:
    branches:
      - main
  schedule:
    # First of the month, shortly after the nightly CVE database refresh (03:30 UTC) and
    # meta-sysele-astrial-h15's own bump-poky (03:00 UTC). Canary: publishes nothing
    # permanent (the continuous prerelease is overwritten, not a new tag).
    - cron: '0 4 1 * *'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      release: continuous
      use_cache: false
      # The canary is the only one of the two triggers that runs unattended and
      # without review, so it's the one that must catch a CVE regression on its
      # own. A push keeps sbom: none, same as meta-sysele-astrial-h15 and
      # meta-sysele-astrial-imx8.
      sbom: ${{ github.event_name == 'schedule' && (vars.SYSELE_SBOM || 'standard') || 'none' }}
    secrets: inherit
